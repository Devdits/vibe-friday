services:
  app:
    image: vibe-friday-app
    build:
      context: .
      target: development
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      WATCHPACK_POLLING: "true"
    init: true
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:8791:3000"
    restart: unless-stopped
    stop_grace_period: 10s
    volumes:
      - .:/workspace
      - app_node_modules:/workspace/node_modules
      - next_cache:/workspace/.next
    healthcheck:
      # prettier-ignore
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 10s

volumes:
  app_node_modules:
  next_cache:
