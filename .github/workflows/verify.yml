name: Verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - name: Build verification image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: development
          load: true
          tags: vibe-friday-app
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify through Docker
        run: VIBE_FRIDAY_SKIP_IMAGE_BUILD=1 ./vibe-friday verify
