name: Deploy to Vercel

on:
  workflow_run:
    workflows: ["Verify"]
    types: [completed]
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: vercel-production
  cancel-in-progress: true

jobs:
  deploy:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - name: Confirm verified commit is current
        env:
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "$(git rev-parse HEAD)" != "$VERIFIED_SHA" ]; then
            echo "Skipping: main has advanced since this Verify run."
            exit 0
          fi

      - name: Trigger Vercel production deployment
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          curl --fail --silent --show-error --request POST "$VERCEL_DEPLOY_HOOK" --output /dev/null
          echo "Vercel deployment triggered."
