name: Deploy to Vercel

on:
  workflow_run:
    workflows: ["Verify"]
    types: [completed]
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: vercel-production
  cancel-in-progress: true

jobs:
  deploy:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - name: Check out current main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Deploy the verified commit
        env:
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ "$(git rev-parse HEAD)" != "$VERIFIED_SHA" ]; then
            echo "Skipping: main has advanced since this Verify run."
            exit 0
          fi

          if [ -z "$VERCEL_DEPLOY_HOOK" ]; then
            echo "The VERCEL_DEPLOY_HOOK secret is not configured." >&2
            exit 1
          fi

          curl --fail-with-body --retry 3 --retry-all-errors \
            --silent --show-error --request POST \
            "$VERCEL_DEPLOY_HOOK" --output /dev/null
          echo "Vercel deployment triggered."
